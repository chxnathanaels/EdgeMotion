name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh --universal
      - run: cd build && ditto -c -k --keepParent LaunchGrid.app LaunchGrid.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchGrid
          path: build/LaunchGrid.zip
