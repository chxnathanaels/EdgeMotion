name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh --universal
      - name: Zip
        run: cd build && ditto -c -k --keepParent EdgeMotion.app EdgeMotion.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeMotion
          path: build/EdgeMotion.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/EdgeMotion.zip
          generate_release_notes: true
